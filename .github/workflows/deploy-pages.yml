# Deploys the React/Vite frontend to GitHub Pages (https://alishnis.github.io/crowdless-app/).
# Frontend only: the YOLO backend is intentionally not hosted, so VITE_API_URL is left unset and
# the pages show their "backend offline" state. One-time setup: Settings -> Pages -> Source:
# GitHub Actions. Optional secret: VITE_GOOGLE_MAPS_API_KEY (browser key, restrict it by HTTP referrer).
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_BASE: /crowdless-app/
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build
      - name: SPA fallback (deep links like /lab and /monitor)
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
