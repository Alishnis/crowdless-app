name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # The tests never load model weights, so the heavy torch/ultralytics
      # install is skipped; only what the counting logic and API import is needed.
      - name: Install light dependencies
        run: |
          pip install numpy opencv-python-headless lap fastapi python-multipart
          pip install -r backend/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Type-check and build
        run: npm run build
